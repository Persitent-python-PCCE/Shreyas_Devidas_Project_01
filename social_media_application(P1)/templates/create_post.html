<form method="POST" enctype="multipart/form-data">

    <div class="mb-3">

        <label class="form-label">
            Post Content
        </label>

        <textarea
            name="content"
            class="form-control"
            rows="5"
            required></textarea>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Upload Image
        </label>

        <input
            type="file"
            name="image"
            class="form-control"
            accept=".jpg,.jpeg,.png,.gif">

    </div>

    <button
        type="submit"
        class="btn btn-primary">

        Create Post

    </button>

</form>
