<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Post</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="mb-4">
                        Create Post
                    </h2>

                    {% if error %}

                    <div class="alert alert-danger">
                        {{ error }}
                    </div>

                    {% endif %}


                    <form method="POST"
                          action="/create-post">

                        <div class="mb-3">

                            <label class="form-label">
                                What's on your mind?
                            </label>

                            <textarea
                                name="content"
                                class="form-control"
                                rows="5"
                                placeholder="Write something..."
                                required></textarea>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary">

                            Publish Post

                        </button>

                        <a
                            href="/feed"
                            class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
