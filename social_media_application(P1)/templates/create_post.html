<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Create Post - SocialApp</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/feed">
            SocialApp
        </a>

        <div>
            <a href="/feed" class="btn btn-outline-light btn-sm">
                Home
            </a>

            <a href="/profile" class="btn btn-outline-light btn-sm">
                Profile
            </a>

            <a href="/logout" class="btn btn-danger btn-sm">
                Logout
            </a>
        </div>

    </div>
</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Create New Post</h4>
                </div>

                <div class="card-body">

                    {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                    {% endif %}


                    <form method="POST"
                          enctype="multipart/form-data">

                        <!-- Content -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                What's on your mind?
                            </label>

                            <textarea
                                name="content"
                                class="form-control"
                                rows="5"
                                placeholder="Write something..."
                                required></textarea>

                        </div>


                        <!-- Image -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Add Image
                            </label>

                            <input
                                type="file"
                                name="image"
                                class="form-control"
                                accept=".jpg,.jpeg,.png,.gif">

                            <small class="text-muted">
                                Allowed: JPG, JPEG, PNG, GIF. Maximum size: 5 MB.
                            </small>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary">

                            Create Post

                        </button>

                        <a
                            href="/feed"
                            class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
